name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # CI build uses harmless defaults — credentials are entered at runtime.
          VITE_API_BASE_URL: https://example.invalid
          VITE_APP_NAME: Customer Admin Portal

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The Playwright config calls `npm run e2e:serve`, which builds the
      # SPA in test mode (with the dev `api-key`/admin pre-seeded into
      # session storage by the helpers) and previews it on a free port.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: "true"
          # Same harmless defaults as the build job — the E2E suite mocks
          # /My/** routes via Playwright `page.route`, so no real backend
          # is needed.
          VITE_API_BASE_URL: https://example.invalid
          VITE_APP_NAME: Customer Admin Portal
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright trace + screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (login)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `lighthouserc.json` -> startServerCommand: `npm run e2e:serve`,
      # which builds the SPA in test mode (loading .env.test) and previews
      # it on 127.0.0.1:4173. Lighthouse runs 3 times and asserts against
      # the budget. Reports are uploaded to Lighthouse's temporary public
      # storage; the URL appears in the job log.
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: customer-admin-portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
