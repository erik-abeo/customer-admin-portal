server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # ---- Static SPA assets --------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cheap, dependency-free liveness endpoint for ECS / Kubernetes probes.
    # Returns 200 with a fixed body and never touches disk.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite writes the bundle to /assets/ with a content hash in every file
    # name, so those can be cached for a year: a new build is new names.
    # ^~ makes this win over the regex below. index.html is not cached, so a
    # redeploy is picked up immediately.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Files copied from public/ as they are (favicon, logos, robots.txt) keep
    # their names across releases, so they are cached for an hour, not a year.
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|txt)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ---- API proxy ----------------------------------------------------------
    # The SPA calls /api (VITE_API_BASE_URL), and this block forwards /api/* to
    # the ASP.NET ClientRemoteDatabaseAccessAPI on the gateway server. It is
    # required: the service does not enable CORS, so the SPA cannot call the
    # gateway directly on another origin.
    #
    # This file is copied in as is, not rendered from a template, so
    # environment variables do not change the upstream. To change it, edit
    # $gateway below and connect-src in security-headers.conf, and rebuild.
    #
    # The gateway's name is resolved at request time, not once at startup, so a
    # change in its address (a new load balancer IP) is picked up within a
    # minute instead of needing a restart. That needs a resolver.
    # 169.254.169.253 is the Amazon-provided DNS server, reachable from any task
    # in a VPC, Fargate included. Outside AWS, set your own (for example
    # 127.0.0.11 under Docker, or your network's DNS server).
    resolver 169.254.169.253 valid=60s ipv6=off;
    resolver_timeout 5s;
    set $gateway "remotedb.crystalpm.net";

    location /api/ {
        # With a variable in proxy_pass nginx no longer swaps the location
        # prefix for the URI, so the rewrite strips /api/ itself; the query
        # string is kept.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         https://$gateway;
        proxy_set_header   Host                $proxy_host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        # Verify the upstream's certificate. nginx does not by default, which
        # would let anything on the path between here and the gateway read the
        # admin api-key off every request. The bundle is the image's own
        # (Alpine ca-certificates). The name sent for SNI and checked against
        # the certificate is the gateway's.
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name         on;
        proxy_ssl_name                $gateway;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ---------------------------------------------------
    # Kept in one file and included here and in every location above that sets
    # a header of its own; see the file for why.
    include /etc/nginx/snippets/security-headers.conf;

    # ---- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
}
