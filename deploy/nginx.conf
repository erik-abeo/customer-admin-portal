server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # ---- Static SPA assets --------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cheap, dependency-free liveness endpoint for ECS / Kubernetes probes.
    # Returns 200 with a fixed body and never touches disk.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Long-cache hashed bundle assets. index.html is not cached, so a
    # redeploy is picked up immediately.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ---- Optional API proxy -------------------------------------------------
    # When the SPA is configured with VITE_API_BASE_URL=/api, this block
    # forwards /api/* to the ASP.NET ClientRemoteDatabaseAccessAPI on the
    # gateway server. This file is copied in as is, not rendered from a
    # template, so environment variables do not change the upstream: edit the
    # proxy_pass line below and rebuild the image. If you don't proxy through
    # this container, leave VITE_API_BASE_URL pointing directly at the gateway
    # origin and remove this block.
    location /api/ {
        proxy_pass         https://remotedb.crystalpm.net/;
        proxy_set_header   Host                $proxy_host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        # Verify the upstream's certificate. nginx does not by default, which
        # would let anything on the path between here and the gateway read the
        # admin api-key off every request. The bundle is the image's own
        # (Alpine ca-certificates). proxy_ssl_name must match the host in
        # proxy_pass; change both together.
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name         on;
        proxy_ssl_name                remotedb.crystalpm.net;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ---------------------------------------------------
    # Kept in one file and included here and in every location above that sets
    # a header of its own; see the file for why.
    include /etc/nginx/snippets/security-headers.conf;

    # ---- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
}
