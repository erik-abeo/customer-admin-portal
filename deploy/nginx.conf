server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # ---- Static SPA assets --------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cheap, dependency-free liveness endpoint for ECS / Kubernetes probes.
    # Returns 200 with a fixed body and never touches disk.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # Long-cache hashed bundle assets. index.html and config.json are not
    # cached so a redeploy is picked up immediately.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ---- Optional API proxy -------------------------------------------------
    # When the SPA is configured with VITE_API_BASE_URL=/api, this block
    # forwards /api/* to the ASP.NET ClientRemoteDatabaseAccessAPI on the
    # gateway server. Override CAP_API_UPSTREAM at deploy time, e.g.:
    #   docker run -e CAP_API_UPSTREAM=https://gateway.internal:5001 ...
    # If you don't proxy through this container, leave VITE_API_BASE_URL
    # pointing directly at the gateway origin and remove this block.
    location /api/ {
        # Default upstream — overrideable via env in your reverse-proxy
        # template if you bake one in. For static deployments just edit
        # this line during build.
        proxy_pass         https://remotedb.crystalpm.net/;
        proxy_set_header   Host                $proxy_host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP: tight by default. The connect-src must include any external API
    # origin you talk to directly (i.e. when not proxying through /api/).
    # If you enable Sentry (VITE_SENTRY_DSN), append your project's ingest
    # host(s) to connect-src — typically https://*.ingest.sentry.io. Edit
    # deploy/nginx.conf or override via your reverse proxy / WAF.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://remotedb.crystalpm.net https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                  always;
    add_header Cross-Origin-Resource-Policy "same-origin"                  always;
    add_header X-XSS-Protection             "0"                            always;

    # ---- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
}
