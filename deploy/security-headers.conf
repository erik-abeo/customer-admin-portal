# Security headers for every response.
#
# Included at server level in nginx.conf and again inside every location that
# sets a header of its own. nginx only inherits add_header from the enclosing
# level when a location has none, so a location that adds Cache-Control would
# otherwise drop all of these. That includes location = /index.html, which the
# SPA fallback serves for every route, so without the include no page would
# carry them.

add_header X-Content-Type-Options    "nosniff"           always;
add_header X-Frame-Options           "DENY"              always;
add_header Referrer-Policy           "no-referrer"       always;
add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# CSP: tight by default. The connect-src must include any external API
# origin you talk to directly (i.e. when not proxying through /api/).
# If you enable Sentry (VITE_SENTRY_DSN), append your project's ingest
# host(s) to connect-src; the default, US and EU (de) ingest hosts are already
# allowed. Edit this
# file or override via your reverse proxy / WAF.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://remotedb.crystalpm.net https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Cross-Origin-Opener-Policy   "same-origin"                  always;
add_header Cross-Origin-Resource-Policy "same-origin"                  always;
add_header X-XSS-Protection             "0"                            always;
