<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Customer Admin Portal</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        background: #f8f9fa;
        color: #212529;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1b1e;
          color: #c1c2c5;
        }
      }
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .app-splash-logo {
        width: 200px;
        height: auto;
        opacity: 0.92;
      }
      .app-splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid currentColor;
        border-top-color: transparent;
        animation: app-splash-spin 0.8s linear infinite;
        opacity: 0.55;
      }
      .app-splash-text {
        font-size: 13px;
        opacity: 0.55;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" aria-label="Loading">
        <img class="app-splash-logo" src="/crystalpm-logo.png" alt="CrystalPM" />
        <div class="app-splash-spinner" aria-hidden="true"></div>
        <div class="app-splash-text">Loading the admin portal…</div>
      </div>
    </div>
    <noscript>
      <div
        style="padding: 24px; max-width: 480px; margin: 64px auto; text-align: center"
      >
        <h1 style="margin: 0 0 8px 0">JavaScript is required</h1>
        <p>
          The Customer Admin Portal is a single-page application and needs JavaScript
          enabled to function.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
